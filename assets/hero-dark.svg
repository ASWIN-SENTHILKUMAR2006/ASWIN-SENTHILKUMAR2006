<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="124" viewBox="0 0 640 124" role="img" aria-label="Aswin Senthilkumar — Java Full Stack Developer, Spring Boot, MySQL">
  <title>Aswin Senthilkumar — Java Full Stack Developer</title>
  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 37px; font-weight: 700; letter-spacing: 6px; fill: #E6EDF3;
    }
    .sub {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 15px; letter-spacing: 0.6px; fill: #7D8590;
    }
    .accent { fill: #6DB33F; }
    .rule {
      stroke: #6DB33F; stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 120; stroke-dashoffset: 120;
      animation: draw 1.1s cubic-bezier(.2,.7,.3,1) .15s forwards;
    }
    .caret { fill: #6DB33F; animation: blink 1.15s steps(1) infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <text class="name" x="2" y="50">ASWIN SENTHILKUMAR</text>
  <line class="rule" x1="3" y1="72" x2="123" y2="72" />
  <text class="sub" x="2" y="106">Java Full Stack Developer<tspan class="accent"> · </tspan>Spring Boot<tspan class="accent"> · </tspan>MySQL<tspan class="caret">_</tspan></text>
</svg>
